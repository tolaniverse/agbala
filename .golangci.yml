version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wastedassign
    # A goroutine that outlives its caller is the leak Àgbàlá is most exposed
    # to: long-lived streaming sessions, detach, reattach. Every goroutine
    # takes a context and every spawn site documents how it exits.
    - contextcheck

  settings:
    revive:
      rules:
        - name: exported
          disabled: false
    goconst:
      min-occurrences: 4

  exclusions:
    rules:
      # Table-driven tests repeat literals by design.
      - path: _test\.go
        linters: [goconst, unparam]

formatters:
  enable:
    - gofmt
