name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  GOLANGCI_VERSION: "v2.13.1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify formatting
        run: make check-fmt
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  perf:
    name: perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Blocking: allocation counts and byte counts are a function of the code
      # and its input, so a change in them is a real change.
      - name: Gate allocation metrics
        run: make bench-gate
      # The transcript lives in our heap rather than the terminal's scrollback,
      # so a long session is only survivable if it is bounded. This is the test
      # that says so with a number.
      - name: Soak
        run: go test -run TestSoak -v ./internal/session/
      # Reporting only: wall-clock on a shared runner varies with whatever else
      # the machine is doing. Gating on it would train everyone to re-run the
      # job, so it is recorded for a human to read instead.
      - name: Record timings
        if: always()
        run: |
          {
            echo '### Render benchmarks'
            echo
            echo '```'
            go test -run '^$' -bench 'BenchmarkFrame' -benchmem ./internal/ui/ || true
            echo '```'
            echo
            echo '_Timings are reported, not gated. Allocation metrics are gated by the step above._'
          } >> "$GITHUB_STEP_SUMMARY"

  # The sandbox tests skip themselves when no container runtime answers, so the
  # `test` job above stays green on a machine without one. This job provisions a
  # runtime so they actually run — a skipped test proves nothing about the
  # boundary it exists to check.
  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Confirm a runtime is reachable
        run: docker info --format '{{.ServerVersion}}'
      - name: Sandbox tests
        run: go test -race -count=1 -v ./internal/sandbox/...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # The host binary ships as a single static executable with no runtime to
      # install — PRODUCT_SPEC.md treats that as a requirement, so every target
      # is cross-compiled on every pull request rather than at release time.
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags '-s -w' -o /dev/null ./cmd/agbala
